name: Live LoL Patch & Meta Synchronization

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Patch & Meta Synchronization Scripts
        run: npm run sync-patch

      - name: Build and Validate Bundle
        run: npm run build

      - name: Commit and Push Updated Patch Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No patch changes detected."
          else
            git commit -m "chore(data): auto-sync live League patch balance and meta data [skip ci]"
            git push
          fi
