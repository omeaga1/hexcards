<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HexCards | Tactical League of Legends Companion</title>
    <meta name="description" content="Deadlock-style tactical item decks, zero-slop ability mechanics, and 1-click Riot Client shop export. No Overwolf, zero ads, 100% Vanguard safe." />
    <meta name="theme-color" content="#059669" />

    <!-- OpenGraph / Discord & Social Sharing Embeds -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HexCards — Anti-Bloat League of Legends Companion" />
    <meta property="og:description" content="Itemize like a Challenger without the ad bloat and CPU lag. 1-click Riot Client shop injection, Deadlock tactical HUD, ~60MB RAM footprint." />
    <meta property="og:site_name" content="HexCards" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HexCards — Anti-Bloat League of Legends Companion" />
    <meta name="twitter:description" content="Itemize like a Challenger without the ad bloat and CPU lag. 1-click in-game shop export, zero ads, 100% Vanguard compliant." />

    <!-- Google Fonts for Deadlock & Tactical Gaming Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Theme initialization script (prevents flash of wrong theme, defaults to Osaka Jade) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hexcards_theme');
          var theme = saved || 'osaka-jade';
          document.documentElement.setAttribute('data-theme', theme);
          var metaColor = theme === 'tactical-light' ? '#f8fafc' : (theme === 'midnight-hextech' ? '#0b0f19' : (theme === 'noxian-blood' ? '#0f0a0c' : '#111c18'));
          var metaTag = document.querySelector('meta[name="theme-color"]');
          if (metaTag) metaTag.setAttribute('content', metaColor);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'osaka-jade');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
